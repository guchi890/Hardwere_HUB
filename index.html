<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>AIdeal Hardware Hub</title>
</head>
<body class="bg-gray-900 text-white font-sans">
    <!-- Header -->
    <nav class="p-6 bg-slate-800 border-b border-cyan-500">
        <h1 class="text-2xl font-bold text-cyan-400">Universal Sensor Dashboard</h1>
    </nav>

    <!-- Main Content -->
    <main class="p-10">
        <div class="flex gap-4 mb-10">
            <button id="connectBtn" class="bg-cyan-600 hover:bg-cyan-500 px-6 py-2 rounded-full font-bold transition">
                🔌 Connect Board
            </button>
            <div id="status" class="text-gray-400 self-center">Status: Disconnected</div>
        </div>

        <!-- Sensor Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Example Sensor Card -->
            <div class="bg-slate-800 p-6 rounded-xl border border-gray-700 hover:border-cyan-500 transition">
                <h3 class="text-xl font-semibold mb-2">DHT11 Temperature</h3>
                <div class="text-4xl font-mono text-cyan-400" id="tempData">--°C</div>
                <button class="mt-4 text-sm text-gray-400 underline">View Wiring Pinout</button>
            </div>
        </div>
    </main>
</body>
</html>
